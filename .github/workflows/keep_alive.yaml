name: Keep Render Alive

on:
  schedule:
    # Runs automatically every 12 minutes
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping Request
        run: curl -s https://onrender.com
